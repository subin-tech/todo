<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>📝 Todo App</h1>
      <p class="app__subtitle">할 일을 추가하고, 완료 처리하고, 삭제해보세요.</p>
    </header>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="할 일을 입력하세요..."
        autocomplete="off"
        maxlength="200"
      />
      <button type="submit" class="btn btn--add">추가</button>
    </form>

    <div class="todo-filters">
      <button class="filter-btn is-active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">진행중</button>
      <button class="filter-btn" data-filter="completed">완료</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <div class="empty-state" id="empty-state" hidden>
      <p>표시할 할 일이 없습니다 🎉</p>
    </div>

    <footer class="todo-footer">
      <span id="items-left">0개 남음</span>
      <button id="clear-completed" class="btn btn--clear">완료 항목 삭제</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
